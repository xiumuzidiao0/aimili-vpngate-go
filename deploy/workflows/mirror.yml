name: Update VPNGate Mirror

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mirror:
    name: Fetch & Update Mirror Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'

      - name: Fetch and Validate Latest VPNGate Nodes
        run: |
          go run ./cmd/mirror

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mirror/vpngate.csv mirror/vpngate.meta.json
          if git diff --staged --quiet; then
            echo "Mirror data unchanged, skipping commit."
          else
            git commit -m "chore: automated VPNGate mirror update [skip ci]"
            git push origin main
          fi
